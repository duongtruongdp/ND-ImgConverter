name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # macOS Apple Silicon (M1/M2/M3/M4)
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'

          - platform: 'macos-13' # macOS Intel x86_64 (Dùng runner macos-13 native Intel để không lỗi C cross-compile)
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'

          - platform: 'windows-latest' # Windows x64 (MSI / EXE)
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ND Image Converter v__VERSION__'
          releaseBody: 'See the assets below to download and install for your OS.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}