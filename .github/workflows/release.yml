name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build (for example v0.7.0)'
        required: true
        default: 'v0.7.0'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-13"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            args: ""
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies and FFmpeg (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg

      - name: Bundle FFmpeg binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$(cygpath "$(where.exe ffmpeg | head -1)")" src-tauri/binaries/ffmpeg
            cp "$(cygpath "$(where.exe ffprobe | head -1)")" src-tauri/binaries/ffprobe
          else
            cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg
            cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe
            chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force lcms2-sys to compile Little-CMS2 statically. Without this,
          # macOS links against the build machine's Homebrew dylib path and
          # the shipped app crashes on machines without Homebrew.
          LCMS2_STATIC: '1'
        with:
          tagName: ${{ github.event.inputs.release_tag || github.ref_name }}
          releaseName: 'ND Image Converter ${{ github.event.inputs.release_tag || github.ref_name }}'
          releaseBody: 'See changelog for detailed release notes.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
