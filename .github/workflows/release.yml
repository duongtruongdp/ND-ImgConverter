name: "Release App"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build"
        required: true
        default: "v0.8.0"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-13"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            args: ""
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies and FFmpeg (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg

      - name: Bundle FFmpeg binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries/lib
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$(cygpath "$(where.exe ffmpeg | head -1)")" src-tauri/binaries/ffmpeg
            cp "$(cygpath "$(where.exe ffprobe | head -1)")" src-tauri/binaries/ffprobe
          else
            cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg
            cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe
            chmod +x src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe
          fi

      - name: Bundle macOS FFmpeg dependencies
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          mkdir -p src-tauri/binaries/lib
          for binary in src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe; do
            while read -r dependency; do
              library="$(printf '%s\n' "$dependency" | awk '{print $1}')"
              case "$library" in
                /opt/homebrew/*|/usr/local/*)
                  destination="src-tauri/binaries/lib/$(basename "$library")"
                  if [ ! -f "$destination" ]; then
                    cp "$library" "$destination"
                    chmod +x "$destination"
                    install_name_tool -id "@loader_path/$(basename "$destination")" "$destination" || true
                  fi
                  install_name_tool -change "$library" "@loader_path/lib/$(basename "$destination")" "$binary" || true
                  ;;
              esac
            done < <(otool -L "$binary" | tail -n +2)
          done
          for pass in 1 2 3 4 5; do
            for library in src-tauri/binaries/lib/*.dylib; do
              [ -f "$library" ] || continue
              while read -r dependency; do
              dependency_path="$(printf '%s\n' "$dependency" | awk '{print $1}')"
              case "$dependency_path" in
                /opt/homebrew/*|/usr/local/*)
                  dependency_name="$(basename "$dependency_path")"
                  destination="src-tauri/binaries/lib/$dependency_name"
                  if [ ! -f "$destination" ]; then cp "$dependency_path" "$destination"; chmod +x "$destination"; install_name_tool -id "@loader_path/$dependency_name" "$destination" || true; fi
                  install_name_tool -change "$dependency_path" "@loader_path/$dependency_name" "$library" || true
                  ;;
              esac
              done < <(otool -L "$library" | tail -n +2)
            done
          done
      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LCMS2_STATIC: '1'
        with:
          tagName: ${{ github.event.inputs.release_tag || github.ref_name }}
          releaseName: "ND Image Converter ${{ github.event.inputs.release_tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ### 🔒 Privacy & Security Notice
            **ND Image Converter is 100% open-source, safe, and contains NO malware or telemetry.**
            Because the app is not code-signed with expensive Apple Developer or Microsoft certificates, your operating system may show a security prompt upon first launch.

            ---

            ### 🍏 macOS Installation Guide
            If macOS displays an error like *"App is damaged and can't be opened"* or blocks the app via Gatekeeper:
            1. Drag **ND Image Converter** into your `/Applications` folder.
            2. Open **Terminal** and run the following command to remove the quarantine flag:
            ```bash
            sudo xattr -cr /Applications/ND\ Image\ Converter.app
            ```
            3. Enter your Mac password when prompted, then open the app normally.
            > *Alternative:* Right-click the app in Finder $\rightarrow$ Select **Open** $\rightarrow$ Click **Open** in the confirmation dialog.

            ---

            ### 🪟 Windows Installation Guide
            If Windows SmartScreen displays *"Windows protected your PC"*:
            1. Click **More info**.
            2. Click **Run anyway**.
            3. *(If required)* Right-click the installer/app and choose **Run as administrator**.

            ---
            *All conversions are processed 100% locally on your machine.*
