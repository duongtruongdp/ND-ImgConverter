[package]
name = "nd-image-converter"
version = "0.6.0"
description = "Fast offline batch image converter"
authors = ["duongtruongdp"]
edition = "2021"

[lib]
name = "nd_image_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rayon = "1.10"
tokio = { version = "1", features = ["sync"] }
webp = "0.3"
base64 = "0.22"

image = { version = "0.25", features = [
    "jpeg", 
    "png", 
    "webp", 
    "bmp", 
    "ico", 
    "tiff", 
    "tga", 
    "gif", 
    "exr", 
    "pnm", 
    "qoi",
    "avif"
] }

resvg = "0.45"
usvg = "0.45"
rawloader = "0.37"
heic = { version = "0.1", default-features = false, features = ["std"] }
imageproc = "0.25"
rusttype = "0.9"
ab_glyph = "0.2"
# 1. Folder Automation / File System Watcher
notify = "6.1"
notify-debouncer-mini = "0.4"
# 2. Color Management System (ICC Profiles: sRGB, Display P3, Adobe RGB)
lcms2 = "6.0"

# 3. EXIF & Metadata Control
kamadak-exif = "0.5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

